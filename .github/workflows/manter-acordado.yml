# Mantém a demo acordada no plano gratuito do Render (ele hiberna após 15 min sem acesso).
# Limitado ao dia do evento para não gastar a cota de Actions do repositório privado:
# 06:00–21:55 UTC de 8/11 = 03:00–18:55 em Brasília (cobre submissão, Demo Day e premiação).
name: manter-acordado
on:
  schedule:
    - cron: "*/5 6-21 8 11 *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://subsidia.onrender.com/health
